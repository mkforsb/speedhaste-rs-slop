[package]
name = "speedhaste-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Speed Haste port — wgpu race renderer and frame presentation"

[dependencies]
speedhaste-core = { path = "../core" }
wgpu = { version = "30", default-features = false, features = ["wgsl", "std"] }
png = "0.18"

[dev-dependencies]
wgpu = { version = "30", default-features = false, features = ["wgsl", "std", "vulkan", "gles", "parking_lot"] }
